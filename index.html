<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업그레이드 트리 에디터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14161b; --panel:#1b1e25; --panel2:#22262f; --line:#2f3440; --line2:#3b4150;
  --tx:#e7e9ee; --tx2:#a3a9b7; --tx3:#6f7685;
  --acc:#f2a541; --acc2:#ffcf87; --err:#ff6b6b; --warn:#ffc857; --info:#6cb4ff; --ok:#5fd39a;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 'Noto Sans KR',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:700}
button.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
button.ghost:hover{color:var(--tx);border-color:var(--line2)}
button.danger:hover{border-color:var(--err);color:var(--err)}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{background:#11131a;border:1px solid var(--line);border-radius:5px;padding:5px 7px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input[type=checkbox]{width:auto}
input[type=color]{padding:0;height:28px;width:36px}
textarea{resize:vertical;min-height:54px}
.mono{font-family:var(--mono);font-size:12px}
#app{display:grid;grid-template-rows:48px 1fr;height:100vh}
#top{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
#top .title{font-weight:700;margin-right:6px;white-space:nowrap}
#top .title span{color:var(--acc)}
#top .proj{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
#top .sp{flex:1}
#vbadge{display:flex;gap:6px;align-items:center}
.pill{border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.pill.e{background:#4a1f24;color:var(--err)} .pill.w{background:#4a3c1a;color:var(--warn)} .pill.i{background:#1a3350;color:var(--info)} .pill.ok{background:#173a2a;color:var(--ok)}
#main{display:grid;grid-template-columns:290px 1fr 380px;min-height:0}
#left,#right{background:var(--panel);overflow:auto;min-height:0}
#left{border-right:1px solid var(--line);display:flex;flex-direction:column}
#right{border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{flex:1;border:none;border-radius:0;background:transparent;padding:10px 0;color:var(--tx2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
.pad{padding:12px}
.row{display:flex;gap:6px;align-items:center}
.row>*{flex:1}
.row>.fx0{flex:0 0 auto}
.lbl{font-size:11px;color:var(--tx3);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.lbl:first-child{margin-top:0}
.nlist{list-style:none;margin:0;padding:0}
.nlist li{padding:7px 12px;border-bottom:1px solid #20242c;cursor:pointer;display:flex;gap:8px;align-items:center}
.nlist li:hover{background:#20242c}
.nlist li.on{background:#2a2418}
.nlist .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.nlist .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nlist .id{color:var(--tx3);font-family:var(--mono);font-size:11px}
.nlist .flag{font-size:11px}
.sec{border-bottom:1px solid var(--line);padding:12px 14px}
.sec h3{margin:0 0 8px;font-size:12px;color:var(--acc2);display:flex;align-items:center;gap:8px}
.sec h3 small{color:var(--tx3);font-weight:400}
.sec h3 .sp{flex:1}
.lst{display:flex;flex-direction:column;gap:6px}
.item{display:grid;gap:5px;align-items:center}
.x{background:transparent;border:none;color:var(--tx3);padding:2px 6px;font-size:15px}
.x:hover{color:var(--err)}
.add{width:100%;margin-top:6px;border-style:dashed;color:var(--tx2);background:transparent}
.muted{color:var(--tx3)}
.hint{color:var(--tx3);font-size:11.5px;margin-top:4px}
.prev{background:#11131a;border:1px dashed var(--line2);border-radius:6px;padding:7px 9px;margin-top:6px;color:var(--acc2)}
table.cost{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;margin-top:6px}
table.cost td,table.cost th{padding:2px 6px;border-bottom:1px solid #262a33;text-align:right}
table.cost th{color:var(--tx3);font-weight:400}
table.cost td:first-child,table.cost th:first-child{text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--acc)}
#graph{position:relative;overflow:hidden;background:
  radial-gradient(circle at 1px 1px,#262a33 1px,transparent 0) 0 0/22px 22px, var(--bg)}
#graph svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
#graph svg.pan{cursor:grabbing}
#gtools{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
#legend{position:absolute;left:12px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;background:#1b1e25dd;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--tx2);max-width:70%}
#legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.gnode rect.b{fill:#1f232c;stroke:#3a4050;stroke-width:1.2}
.gnode:hover rect.b{stroke:var(--acc)}
.gnode.sel rect.b{stroke:var(--acc);stroke-width:2.4;fill:#2a2418}
.gnode.err rect.b{stroke:var(--err)}
.gnode.idea rect.b{stroke-dasharray:5 3}
.gnode.cut{opacity:.35}
.gnode.dim{opacity:.18}
.gnode text{fill:var(--tx);font-size:13px}
.gnode text.s{fill:var(--tx3);font-size:10.5px;font-family:var(--mono)}
.gnode text.c{fill:var(--tx2);font-size:11px}
.edge{fill:none;stroke:#566076;stroke-width:1.5}
.edge.any{stroke:#8c6fd6;stroke-dasharray:5 4}
.edge.hl{stroke:var(--acc);stroke-width:2.2}
.edge.any.hl{stroke:#b89cff}
.edge.dim{opacity:.1}
.colhdr{fill:var(--tx3);font-size:11px;font-family:var(--mono)}
.empty{padding:40px 20px;text-align:center;color:var(--tx3)}
/* 프로젝트 선택 */
#picker{position:fixed;inset:0;background:#0f1116f2;display:none;align-items:center;justify-content:center;z-index:70}
#picker.on{display:flex}
#picker .pbox{width:min(720px,94vw);max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden}
#picker .phd{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
#picker .phd b{font-size:15px}
#picker .phd b span{color:var(--acc)}
#picker .phd small{color:var(--tx3)}
#picker .plist{overflow:auto;padding:8px;min-height:120px}
#picker .prow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;cursor:pointer;border:1px solid transparent}
#picker .prow:hover{background:var(--panel2);border-color:var(--line2)}
#picker .prow.cur{background:#2a2418;border-color:#4a3c1a}
#picker .prow .sw{width:9px;height:26px;border-radius:3px;flex:0 0 9px}
#picker .prow .nm{flex:1;min-width:0}
#picker .prow .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#picker .prow .nm span{color:var(--tx3);font-size:11.5px}
#picker .prow .acts{display:flex;gap:2px;opacity:0}
#picker .rn{font-weight:500}
#picker .prow:hover .acts,#picker .prow .acts:focus-within{opacity:1}
#picker .pft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#picker .pft .sp{flex:1}
#top .proj{cursor:pointer}
#top .proj:hover{color:var(--tx)}
/* 그래프 상호작용 */
.gnode{cursor:grab}
.gnode .port{fill:#1f232c;stroke:var(--acc);stroke-width:1.5;opacity:0;cursor:crosshair}
.gnode:hover .port{opacity:1}
.gnode .port:hover{fill:var(--acc)}
.gnode.linkable rect.b{stroke:var(--acc2);stroke-dasharray:4 3}
.gnode .pin{fill:var(--acc2);font-size:11px}
#tmp path{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:5 4;pointer-events:none}
/* 파일 */
#fileChip{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--tx2);white-space:nowrap}
#fileChip b{color:var(--tx);font-weight:500;max-width:140px;overflow:hidden;text-overflow:ellipsis}
#fileChip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 7px}
#fileChip.dirty .dot{background:var(--warn)}
#fileChip.none .dot{background:var(--tx3)}
/* 차트 */
.chart{width:100%;height:320px;display:block;background:#11131a;border:1px solid var(--line);border-radius:8px}
.chart .gl{stroke:#262a33;stroke-width:1}
.chart .ax{fill:var(--tx3);font-size:10px;font-family:var(--mono)}
.chart path.ln{fill:none;stroke-width:2;stroke-linejoin:round}
/* modal */
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:min(860px,94vw);max-height:90vh;display:flex;flex-direction:column}
#modal .hd{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center}
#modal .hd .sp{flex:1}
#modal .bd{padding:14px 18px;overflow:auto}
#modal .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#modal textarea.big{min-height:340px;font-family:var(--mono);font-size:12px}
.vitem{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.vitem:hover{background:var(--panel2)}
.diff{font-family:var(--mono);font-size:12px}
.diff .a{color:var(--ok)} .diff .r{color:var(--err)} .diff .c{color:var(--warn)}
.diff label{display:flex;gap:7px;align-items:flex-start;padding:2px 0;cursor:pointer}
.diff label:hover{background:var(--panel2)}
.diff input[type=checkbox]{flex:0 0 auto;margin-top:3px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b303b;border:1px solid var(--line2);padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
.confirm{color:var(--err);border-color:var(--err)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="title">⬡ <span>Upgrade</span> Tree</div>
    <div class="proj" id="projName" title="프로젝트 전환 (클릭)"></div>
    <button class="ghost" id="undoBtn" title="실행 취소 (Ctrl+Z)">↶</button>
    <button class="ghost" id="redoBtn" title="다시 실행 (Ctrl+Shift+Z)">↷</button>
    <div class="sp"></div>
    <div id="vbadge" title="검증 결과 보기" style="cursor:pointer"></div>
    <div id="fileChip" class="none" title="연결된 로컬 JSON 파일"></div>
    <button id="saveBtn" title="로컬 파일로 저장 (Ctrl+S)">파일로 저장</button>
    <button id="importBtn">불러오기</button>
    <button id="exportBtn">내보내기</button>
    <button class="pri" id="aiBtn">AI에게 넘기기</button>
  </div>
  <div id="main">
    <aside id="left">
      <div class="tabs" id="tabs">
        <button data-tab="nodes" class="on">노드</button>
        <button data-tab="res">재화</button>
        <button data-tab="proj">프로젝트</button>
      </div>
      <div id="leftBody" style="flex:1"></div>
    </aside>
    <section id="graph">
      <svg id="svg"><defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#566076"/></marker>
        <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c6fd6"/></marker>
        <marker id="arH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2a541"/></marker>
      </defs><g id="vp"><g id="cols"></g><g id="edges"></g><g id="nodes"></g><g id="tmp"></g></g></svg>
      <div id="legend"></div>
      <div id="gtools">
        <button id="zoomOut">−</button><button id="zoomIn">+</button><button id="fitBtn">전체 보기</button>
      </div>
    </section>
    <aside id="right"></aside>
  </div>
</div>
<div id="modal"><div class="box"><div class="hd"><span id="mTitle"></span><div class="sp"></div><button class="ghost" id="mClose">✕</button></div><div class="bd" id="mBody"></div><div class="ft" id="mFoot"></div></div></div>
<div id="picker"><div class="pbox">
  <div class="phd"><b>⬡ <span>Upgrade</span> Tree</b><small>프로젝트를 고르세요</small></div>
  <div class="plist" id="plist"></div>
  <div class="pft">
    <button class="pri" id="pkNew">+ 새 프로젝트</button>
    <button id="pkSample">샘플 (Stranded God)</button>
    <button id="pkFile">JSON 파일 열기…</button>
    <div class="sp"></div>
    <button class="ghost" id="pkClose">닫기</button>
  </div>
</div></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= 데이터 ================= */
const SCHEMA = 'upgrade-tree/2';
const STATUS = {idea:'아이디어', wip:'작업 중', done:'구현됨', cut:'폐기'};
const STATUS_COLOR = {idea:'#7a8295', wip:'#6cb4ff', done:'#5fd39a', cut:'#5a4350'};
const EFFECT_TYPES = {
  produce:'생산 (+초당)', multiply:'배율 (×)', add:'가산 (+)', unlock:'기능 해금', custom:'기타'
};
const STORE_KEY = 'upgradeTreeEditor.project.v1'; // 구버전(단일 프로젝트) 키 — 이관용
const LIST_KEY = 'upgradeTreeEditor.projects';
const LAST_KEY = 'upgradeTreeEditor.lastProject';
const MIG_KEY  = 'upgradeTreeEditor.migrated';
const dataKey = id=>'upgradeTreeEditor.proj.'+id;

function sample(){
  return {
    schema: SCHEMA,
    meta: {
      name: 'Stranded God',
      concept: '지구에 불시착한 귀여운 외계인이 원시시대 인류를 발전시켜 항성간 이동 기술을 완성하고 집으로 돌아가는 코믹 인크리멘탈. Steam 데스크탑, Unity. 프레스티지 없음. 돈스타브식 월드 화면에서 바닥의 나무·돌을 클릭해 줍는 것으로 시작하고, 진행할수록 활동 반경과 카메라 줌아웃이 커진다. 건물은 숨겨진 격자에 직사각형으로 배치.'
    },
    resources: [
      {id:'food', name:'식량', manual:true, note:'채집으로 시작'},
      {id:'wood', name:'나무', manual:true, note:'바닥에서 클릭해 줍기 (유한)'},
      {id:'stone', name:'돌', manual:true, note:'바닥에서 클릭해 줍기 (유한)'},
      {id:'population', name:'인구', manual:false, note:''}
    ],
    nodes: [
      N('fire','불',['원시'],1,[['wood',1,1],['stone',1,1]],[],[],[{type:'unlock',target:'campfire',value:1,perLevel:false}],
        '불을 피운다. 모닥불 건설이 해금된다.','첫 테크. 식량 없이 나무1·돌1만으로.','done'),
      N('cooking','요리',['원시'],1,[['food',10,1],['wood',5,1]],[{node:'fire',minLevel:1}],[],[{type:'multiply',target:'food.value',value:1.5,perLevel:false}],
        '식량 가치 ×{value1}','불 다음 바로 보이는 보상.','idea'),
      N('stone_tools','뗀석기',['원시'],5,[['stone',8,1.4]],[{node:'fire',minLevel:1}],[],[{type:'multiply',target:'gather.speed',value:1.25,perLevel:true}],
        '레벨당 채집 속도 ×{value1}','클릭 피로를 덜어주는 첫 반복 업그레이드.','idea'),
      N('alien_scout','외계인 탐사',['원시'],3,[['food',15,1.8]],[{node:'fire',minLevel:1}],[],[{type:'add',target:'explore.radius',value:1,perLevel:true}],
        '활동 반경 +{value1} (레벨당)','원시 한정. 외계인이 직접 탐사해 반경 확장.','idea'),
      N('gathering_basket','채집 바구니',['원시'],3,[['wood',12,1.5]],[{node:'stone_tools',minLevel:1}],[],[{type:'add',target:'gather.amount',value:1,perLevel:true}],
        '클릭당 채집량 +{value1}','','idea'),
      N('shelter','동굴 정비',['원시'],1,[['wood',20,1],['stone',20,1]],[{node:'fire',minLevel:1}],[],[{type:'unlock',target:'building_grid',value:1,perLevel:false},{type:'produce',target:'population',value:0.02,perLevel:false}],
        '건물 격자(3x3) 해금, 인구 +{value2}/초','동굴은 최초 3x3.','idea'),
      N('hunting','사냥',['원시'],3,[['stone',15,1.6],['food',10,1.6]],[{node:'stone_tools',minLevel:2}],[],[{type:'produce',target:'food',value:0.2,perLevel:true}],
        '식량 자동 생산 +{value1}/초 (레벨당)','첫 자동 생산.','idea'),
      N('language','언어',['원시'],1,[['food',60,1]],[{node:'shelter',minLevel:1}],[{resource:'population',reached:10}],[{type:'multiply',target:'research.speed',value:1.2,perLevel:false}],
        '연구 속도 ×{value1}','인구 10 도달 조건 — 자원 마일스톤 예시.','idea'),
      N('agriculture','농경',['고대'],1,[['food',150,1],['wood',80,1]],[{node:'hunting',minLevel:1},{node:'language',minLevel:1}],[],[{type:'produce',target:'food',value:2,perLevel:false}],
        '식량 생산 +{value1}/초. 고대 시작.','원시→고대 전환점.','idea'),
      N('pottery','토기',['고대'],1,[['stone',100,1]],[{node:'agriculture',minLevel:1}],[{node:'cooking',minLevel:1},{custom:'점토 지형 발견'}],[{type:'multiply',target:'food.storage',value:2,perLevel:false}],
        '식량 저장량 ×{value1}','OR 조건 예시: 요리 또는 점토 발견.','idea')
    ]
  };
  function N(id,name,tags,maxLevel,cost,all,any,effects,description,designNote,status){
    return {id,name,tags,status,maxLevel,
      cost:cost.map(([resource,base,growth])=>({resource,base,growth})),
      requires:{all,any},effects,description,designNote};
  }
}
function blankProject(){
  return {schema:SCHEMA,meta:{name:'새 프로젝트',concept:''},resources:[{id:'gold',name:'골드',manual:true,note:''}],nodes:[]};
}
function normalize(p){
  p = p && typeof p==='object' ? p : {};
  const out = {schema:SCHEMA, meta:Object.assign({name:'이름 없음',concept:''}, p.meta||{}),
    resources:[], nodes:[]};
  for(const r of (p.resources||[])) out.resources.push({id:String(r.id??''),name:String(r.name??r.id??''),manual:!!r.manual,note:String(r.note??'')});
  // upgrade-tree/1 → /2 : 시대(eras)는 없앴다. 옛 데이터의 era는 태그로 옮긴다.
  const eraName=new Map((p.eras||[]).map(e=>[String(e.id??''),String(e.name??e.id??'')]));
  for(const n of (p.nodes||[])){
    const req = n.requires||{};
    out.nodes.push({
      id:String(n.id??''), name:String(n.name??n.id??''), status:STATUS[n.status]?n.status:'idea',
      maxLevel: Number.isFinite(+n.maxLevel)&&+n.maxLevel>0 ? +n.maxLevel : 1,
      cost:(n.cost||[]).map(c=>({resource:String(c.resource??''),base:num(c.base),growth:c.growth==null?1:num(c.growth)})),
      requires:{all:(req.all||[]).map(normCond),any:(req.any||[]).map(normCond)},
      effects:(n.effects||[]).map(e=>({type:EFFECT_TYPES[e.type]?e.type:'custom',target:String(e.target??''),value:e.value??0,perLevel:!!e.perLevel})),
      description:String(n.description??''), designNote:String(n.designNote??''), tags:migTags(n,eraName),
      pos: n.pos && Number.isFinite(+n.pos.x) && Number.isFinite(+n.pos.y) ? {x:Math.round(+n.pos.x),y:Math.round(+n.pos.y)} : null
    });
  }
  return out;
}
function migTags(n,eraName){
  const tags=Array.isArray(n.tags)?n.tags.map(String):[];
  if(n.era){ const t=eraName.get(String(n.era))||String(n.era); if(t && !tags.includes(t)) tags.push(t); }
  return tags;
}
function normCond(c){
  if(c==null) return {custom:''};
  if(typeof c==='string') return {node:c,minLevel:1};
  if('node' in c) return {node:String(c.node),minLevel:c.minLevel==null?1:num(c.minLevel)};
  if('resource' in c) return {resource:String(c.resource),reached:num(c.reached)};
  return {custom:String(c.custom??'')};
}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function condType(c){return 'node' in c?'node':'resource' in c?'resource':'custom'}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const node=id=>P.nodes.find(n=>n.id===id);

const statusColor=st=>STATUS_COLOR[st]||'#666';
const allTags=()=>[...new Set(P.nodes.flatMap(n=>n.tags))].sort((a,b)=>a.localeCompare(b,'ko'));

  : listFilter.startsWith('st:') ? n.status===listFilter.slice(3)

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}
function fmt(n){ if(!Number.isFinite(n)) return String(n); const a=Math.abs(n);
  if(a>=1e15) return n.toExponential(2);
  if(a>=1e12) return (n/1e12).toFixed(2).replace(/\.?0+$/,'')+'T';
  if(a>=1e9) return (n/1e9).toFixed(2).replace(/\.?0+$/,'')+'B';
  if(a>=1e6) return (n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';
  if(a>=1e4) return (n/1e3).toFixed(1).replace(/\.?0+$/,'')+'K';
  return Math.round(n*100)/100+''; }
function costAt(c,lvl){ return Math.ceil(c.base*Math.pow(c.growth||1,lvl-1)); }
function nodeDeps(n){ return [...n.requires.all,...n.requires.any].filter(c=>'node' in c).map(c=>c.node); }
function uniqueId(base){ let id=base,i=2; const ids=new Set(P.nodes.map(n=>n.id)); while(ids.has(id)) id=base+'_'+(i++); return id; }
function slug(s){ return String(s).trim().toLowerCase().replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,''); }
function describe(n){
  let s=n.description||'';
  s=s.replace(/\{value(\d*)\}/g,(m,d)=>{const e=n.effects[(d?+d:1)-1];return e?(typeof e.value==='number'?fmt(e.value):String(e.value)):m;});
  return s.replace(/\{maxLevel\}/g,n.maxLevel);
}

/* ================= 검증 ================= */
function validate(){
  const out=[]; const add=(lv,msg,id)=>out.push({lv,msg,id});
  const ids=new Map();
  for(const n of P.nodes){ if(!n.id) add('e','ID가 비어 있는 노드가 있어요',null); ids.set(n.id,(ids.get(n.id)||0)+1); }
  for(const [id,c] of ids) if(c>1) add('e',`노드 ID "${id}"가 ${c}번 중복돼요`,id);
  const rids=new Set(P.resources.map(r=>r.id));
  const consumed=new Set(), produced=new Set();
  for(const n of P.nodes){
    for(const c of n.cost){
      if(!rids.has(c.resource)) add('e',`비용에 없는 재화 "${c.resource}"`,n.id); else consumed.add(c.resource);
      if(c.base<=0) add('w',`${resName(c.resource)} 기본 비용이 0 이하`,n.id);
      if(n.maxLevel>1 && (c.growth||1)<1) add('w',`${resName(c.resource)} 증가율이 1보다 작아 레벨이 오를수록 싸져요`,n.id);
    }
    for(const c of [...n.requires.all,...n.requires.any]){
      const t=condType(c);
      if(t==='node'){
        if(c.node===n.id) add('e','자기 자신을 요구해요',n.id);
        else if(!ids.has(c.node)) add('e',`없는 노드 "${c.node}"를 요구해요`,n.id);
        else { const d=node(c.node); if(c.minLevel>d.maxLevel) add('e',`"${d.name}" Lv${c.minLevel} 요구 — 최대 레벨은 ${d.maxLevel}`,n.id);
               if(d.status==='cut' && n.status!=='cut') add('w',`폐기된 노드 "${d.name}"에 의존해요`,n.id); }
      } else if(t==='resource'){ if(!rids.has(c.resource)) add('e',`조건에 없는 재화 "${c.resource}"`,n.id); }
      else if(!c.custom.trim()) add('w','비어 있는 기타 조건',n.id);
    }
    for(const e of n.effects){
      if(e.type==='produce'){ if(!rids.has(e.target)) add('e',`생산 효과의 대상 "${e.target}"이 재화가 아니에요`,n.id); else produced.add(e.target); }
      if(!e.target && e.type!=='custom') add('w','효과 대상이 비어 있어요',n.id);
    }
    const refs=[...(n.description||'').matchAll(/\{value(\d*)\}/g)].map(m=>m[1]?+m[1]:1);
    for(const r of refs) if(r>n.effects.length) add('w',`설명의 {value${r}}에 해당하는 효과가 없어요`,n.id);
    if(!n.description.trim()) add('i','설명이 비어 있어요',n.id);
    if(!n.cost.length && !n.requires.all.length && !n.requires.any.length) add('i','비용도 조건도 없어요 — 시작 노드인가요?',n.id);
  }
  // 순환 검사
  const state=new Map(); const stack=[];
  const visit=id=>{ state.set(id,1); stack.push(id); const n=node(id);
    if(n) for(const d of nodeDeps(n)){ if(!ids.has(d)||d===id) continue;
      if(state.get(d)===1){ const cyc=stack.slice(stack.indexOf(d)).concat(d); add('e','순환 의존: '+cyc.join(' → '),id); }
      else if(!state.get(d)) visit(d); }
    stack.pop(); state.set(id,2); };
  for(const n of P.nodes) if(!state.get(n.id)) visit(n.id);
  // 재화
  const rc=new Map(); for(const r of P.resources) rc.set(r.id,(rc.get(r.id)||0)+1);
  for(const [id,c] of rc) if(c>1) add('e',`재화 ID "${id}"가 중복돼요`,null);
  for(const r of P.resources){
    if(!r.manual && !produced.has(r.id)) add('w',`재화 "${r.name}"를 생산하는 노드가 없어요 (직접 수집이면 재화 탭에서 체크)`,null);
    if(!consumed.has(r.id)) add('i',`재화 "${r.name}"를 비용으로 쓰는 노드가 없어요`,null);
  }
  return out;
}

/* ================= 레이아웃 ================= */
const NW=200, NH=64, GX=90, GY=16, PADX=40, PADY=48;
function layout(){
  const map=new Map(P.nodes.map(n=>[n.id,n]));
  const depth=new Map(), vis=new Set();
  const dep=id=>{ if(depth.has(id)) return depth.get(id); if(vis.has(id)) return 0; vis.add(id);
    const n=map.get(id); let d=0;
    for(const p of nodeDeps(n)) if(map.has(p)&&p!==id) d=Math.max(d,dep(p)+1);
    vis.delete(id); depth.set(id,d); return d; };
  P.nodes.forEach(n=>dep(n.id));
  const cols=[]; for(const n of P.nodes){ const d=depth.get(n.id); (cols[d]=cols[d]||[]).push(n); }
  const rowOf=new Map(), pos=new Map();
  cols.forEach((col,d)=>{ if(!col) return;
    const bary=n=>{ const ps=nodeDeps(n).filter(p=>rowOf.has(p)); return ps.length? ps.reduce((a,p)=>a+rowOf.get(p),0)/ps.length : 1e6; };
    col.sort((a,b)=> bary(a)-bary(b) || a.name.localeCompare(b.name,'ko'));
    col.forEach((n,i)=>{ rowOf.set(n.id,i); pos.set(n.id,{x:PADX+d*(NW+GX), y:PADY+i*(NH+GY)}); });
  });
  for(const n of P.nodes) if(n.pos) pos.set(n.id,{x:n.pos.x,y:n.pos.y}); // 수동 배치가 자동 정렬을 덮어씀
  return {pos,depth,cols:cols.length};
}

/* ================= 그래프 렌더 ================= */
function related(id){
  const up=new Set(), down=new Set();
  const children=new Map(); for(const n of P.nodes) for(const d of nodeDeps(n)){ if(!children.has(d)) children.set(d,[]); children.get(d).push(n.id); }
  const goUp=i=>{ const n=node(i); if(!n) return; for(const d of nodeDeps(n)) if(!up.has(d)){ up.add(d); goUp(d); } };
  const goDn=i=>{ for(const c of children.get(i)||[]) if(!down.has(c)){ down.add(c); goDn(c); } };
  goUp(id); goDn(id); return new Set([id,...up,...down]);
}
let lastLayout=null, lastIssues=[];
function ancestors(id){ const out=new Set();
  const go=i=>{ const n=node(i); if(!n) return; for(const d of nodeDeps(n)) if(!out.has(d)){ out.add(d); go(d); } };
  go(id); return out; }
function colsSVG(L){ let s=''; for(let d=0; d<L.cols; d++) s+=`<text class="colhdr" x="${PADX+d*(NW+GX)}" y="${PADY-14}">단계 ${d}</text>`; return s; }
function edgesSVG(L,rel){
  let s='';
  for(const n of P.nodes){ const b=L.pos.get(n.id); if(!b) continue;
    for(const [kind,list] of [['all',n.requires.all],['any',n.requires.any]]) for(const c of list){
      if(!('node' in c)) continue; const a=L.pos.get(c.node); if(!a||c.node===n.id) continue;
      const x1=a.x+NW, y1=a.y+NH/2, x2=b.x-2, y2=b.y+NH/2, mx=(x1+x2)/2;
      const back = x2<=x1;
      const path = back ? `M${x1},${y1} C${x1+60},${y1} ${x2-60},${y2} ${x2},${y2}` : `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
      const hl = rel && rel.has(n.id) && rel.has(c.node);
      const cls=`edge ${kind==='any'?'any':''} ${rel?(hl?'hl':'dim'):''}`;
      const mk = rel&&hl ? 'arH' : kind==='any'?'arA':'ar';
      s+=`<path class="${cls}" d="${path}" marker-end="url(#${mk})"><title>${esc(node(c.node)?.name)} Lv${c.minLevel} → ${esc(n.name)}${kind==='any'?' (OR)':''}</title></path>`;
      if(c.minLevel>1) s+=`<text class="colhdr" x="${(x1+x2)/2}" y="${(y1+y2)/2-4}" text-anchor="middle" ${rel&&!hl?'opacity=".1"':''}>Lv${c.minLevel}</text>`;
    }
  }
  return s;
}
function nodesSVG(L,rel,errIds){
  let s='';
  for(const n of P.nodes){ const p=L.pos.get(n.id); if(!p) continue;
    const cls=['gnode', selSet.has(n.id)?'sel':'', errIds.has(n.id)?'err':'', n.status, rel&&!rel.has(n.id)?'dim':''].join(' ');
    const costTxt = n.cost.map(c=>`${resName(c.resource)} ${fmt(c.base)}`).join(' · ') || '무료';
    const extra = [...n.requires.all,...n.requires.any].some(c=>!('node' in c)) ? ' · +조건' : '';
    const lv = n.maxLevel>1?` ×${n.maxLevel}`:'';
    const st = n.status==='done'?'✓ ':n.status==='wip'?'◐ ':'';
    s+=`<g class="${cls}" data-id="${esc(n.id)}" transform="translate(${p.x},${p.y})">
      <rect class="b" width="${NW}" height="${NH}" rx="8"/>
      <rect width="5" height="${NH-12}" x="0" y="6" rx="2" fill="${esc(statusColor(n.status))}"/>
      <text x="14" y="21">${esc(st+clip(n.name,13))}<tspan class="s" dx="6">${esc(lv)}</tspan></text>
      <text class="s" x="14" y="36">${esc(clip(n.id,26))}</text>
      <text class="c" x="14" y="53">${esc(clip(costTxt+extra,24))}</text>
      ${n.pos?`<text class="pin" x="${NW-10}" y="17" text-anchor="middle">⌖</text>`:''}
      <circle class="port" cx="${NW}" cy="${NH/2}" r="6"><title>드래그해서 다음 노드에 연결</title></circle>
      <title>${esc(n.name)}\n${esc(describe(n))}</title>
    </g>`;
  }
  return s;
}
function currentRel(){ return selSet.size===1 && sel && node(sel) ? related(sel) : null; }
function renderGraph(issues){
  lastIssues=issues;
  const L=layout(); lastLayout=L;
  const errIds=new Set(issues.filter(i=>i.lv==='e'&&i.id).map(i=>i.id));
  const rel=currentRel();
  $('#cols').innerHTML=colsSVG(L);
  $('#edges').innerHTML=edgesSVG(L,rel);
  $('#nodes').innerHTML=nodesSVG(L,rel,errIds);
  $('#tmp').innerHTML='';
  applyView();
  $('#legend').innerHTML = Object.entries(STATUS).map(([k,v])=>`<span><i style="background:${STATUS_COLOR[k]}"></i>${esc(v)}</span>`).join('')
    + `<span>── AND</span><span style="color:#b89cff">┄┄ OR</span><span>⌖ 수동 배치</span>`;
  if(!fitted && P.nodes.length){ fitted=true; fit(); }
}
function clip(s,n){ s=String(s); let w=0,o=''; for(const ch of s){ w+= /[ㄱ-힝]/.test(ch)?1.7:1; if(w>n*1.15){ return o+'…'; } o+=ch; } return o; }
function applyView(){ $('#vp').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`); }
function bounds(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of lastLayout.pos.values()){ x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x+NW); y1=Math.max(y1,p.y+NH); }
  return {x0:x0-PADX, y0:y0-PADY, x1:x1+PADX, y1:y1+PADY};
}
function fit(){
  if(!lastLayout||!P.nodes.length) return;
  const b=bounds(), r=$('#svg').getBoundingClientRect(), w=b.x1-b.x0, h=b.y1-b.y0;
  view.k=Math.min(1.2, Math.max(.15, Math.min(r.width/w, r.height/h)));
  view.x=(r.width-w*view.k)/2 - b.x0*view.k; view.y=(r.height-h*view.k)/2 - b.y0*view.k; applyView();
}
function centerOn(id){
  const p=lastLayout?.pos.get(id); if(!p) return; const r=$('#svg').getBoundingClientRect();
  view.x=r.width/2-(p.x+NW/2)*view.k; view.y=r.height/2-(p.y+NH/2)*view.k; applyView();
}
const cssEsc=s=>String(s).replace(/["\\]/g,'\\$&');
const gnodeEl=id=>document.querySelector(`#nodes .gnode[data-id="${cssEsc(id)}"]`);
function graphPt(e){ const r=$('#svg').getBoundingClientRect(); return {x:(e.clientX-r.left-view.x)/view.k, y:(e.clientY-r.top-view.y)/view.k}; }
function addDep(from,to){
  const f=node(from), n=node(to);
  if(!f||!n||from===to) return;
  if(nodeDeps(n).includes(from)){ toast('이미 연결돼 있어요'); return; }
  if(ancestors(from).has(to)){ toast('순환 의존이 생겨서 연결할 수 없어요'); return; }
  n.requires.all.push({node:from,minLevel:1});
  changed(true); renderAll(); toast(`${f.name} → ${n.name} 연결했어요`);
}
(function graphEvents(){
  const svg=$('#svg'); let pan=null, nd=null, link=null;
  svg.addEventListener('mousedown',e=>{
    if(e.button!==0) return;
    const g=e.target.closest&&e.target.closest('.gnode');
    if(g && e.target.closest('.port')){
      link={from:g.dataset.id};
      document.querySelectorAll('#nodes .gnode').forEach(x=>{ if(x.dataset.id!==link.from) x.classList.add('linkable'); });
      return;
    }
    if(g){
      const id=g.dataset.id;
      const ids = selSet.has(id)&&selSet.size>1 ? [...selSet].filter(i=>lastLayout.pos.has(i)) : [id];
      nd={id,ids,x:e.clientX,y:e.clientY,moved:false,
        start:new Map(ids.map(i=>{ const p=lastLayout.pos.get(i); return [i,{x:p.x,y:p.y}]; }))};
      return;
    }
    pan={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false}; svg.classList.add('pan');
  });
  window.addEventListener('mousemove',e=>{
    if(link){ const a=lastLayout.pos.get(link.from); if(!a) return;
      const p=graphPt(e), x1=a.x+NW, y1=a.y+NH/2;
      $('#tmp').innerHTML=`<path d="M${x1},${y1} C${x1+70},${y1} ${p.x-70},${p.y} ${p.x},${p.y}"/>`; return; }
    if(nd){
      if(!nd.moved && Math.abs(e.clientX-nd.x)+Math.abs(e.clientY-nd.y)>3) nd.moved=true;
      if(!nd.moved) return;
      const dx=(e.clientX-nd.x)/view.k, dy=(e.clientY-nd.y)/view.k;
      for(const i of nd.ids){ const s0=nd.start.get(i); const np={x:Math.round(s0.x+dx),y:Math.round(s0.y+dy)};
        lastLayout.pos.set(i,np); const g=gnodeEl(i); if(g) g.setAttribute('transform',`translate(${np.x},${np.y})`); }
      $('#edges').innerHTML=edgesSVG(lastLayout,currentRel());
      return; }
    if(pan){ const dx=e.clientX-pan.x, dy=e.clientY-pan.y;
      if(Math.abs(dx)+Math.abs(dy)>3) pan.moved=true; view.x=pan.vx+dx; view.y=pan.vy+dy; applyView(); }
  });
  window.addEventListener('mouseup',e=>{
    if(link){
      document.querySelectorAll('.gnode.linkable').forEach(x=>x.classList.remove('linkable'));
      $('#tmp').innerHTML='';
      const g=e.target.closest&&e.target.closest('.gnode');
      const to=g&&g.dataset.id, from=link.from; link=null;
      if(to&&to!==from) addDep(from,to);
      return;
    }
    if(nd){
      if(nd.moved){
        for(const i of nd.ids){ const p=lastLayout.pos.get(i), n=node(i); if(n) n.pos={x:p.x,y:p.y}; }
        const grab = !selSet.has(nd.id);
        if(grab){ sel=nd.id; selSet=new Set([nd.id]); }
        changed(true);
        if(grab) renderAll(); else { renderGraph(lastIssues); renderRight(); }
      } else select(nd.id, e.ctrlKey||e.metaKey||e.shiftKey);
      nd=null; return;
    }
    if(pan){ svg.classList.remove('pan'); if(!pan.moved) select(null); pan=null; }
  });
  svg.addEventListener('wheel',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top;
    const k2=Math.min(2.5,Math.max(.15,view.k*Math.exp(-e.deltaY*0.0015)));
    view.x=mx-(mx-view.x)*k2/view.k; view.y=my-(my-view.y)*k2/view.k; view.k=k2; applyView(); },{passive:false});
  const zoom=f=>{ const r=svg.getBoundingClientRect(); const mx=r.width/2,my=r.height/2; const k2=Math.min(2.5,Math.max(.15,view.k*f));
    view.x=mx-(mx-view.x)*k2/view.k; view.y=my-(my-view.y)*k2/view.k; view.k=k2; applyView(); };
  $('#zoomIn').onclick=()=>zoom(1.2); $('#zoomOut').onclick=()=>zoom(1/1.2); $('#fitBtn').onclick=fit;
})();

function renameRes(i,inp){
  const r=P.resources[i], nv=slug(inp.value);
  if(!nv||(nv!==r.id&&res(nv))){ toast('비었거나 중복된 ID예요'); inp.value=r.id; return; }
  const old=r.id; if(old===nv){ inp.value=nv; return; }
  for(const n of P.nodes){ n.cost.forEach(c=>{ if(c.resource===old) c.resource=nv; });
    [...n.requires.all,...n.requires.any].forEach(c=>{ if(c.resource===old) c.resource=nv; });
    n.effects.forEach(e=>{ if(e.target===old) e.target=nv; else if(e.target.startsWith(old+'.')) e.target=nv+e.target.slice(old.length); }); }
  r.id=nv; changed(true); renderAll();
}

  const t=b.textContent; b.dataset.armed=1; b.classList.add('confirm'); b.textContent= t.length<=2?'삭제?':'정말요?';
  setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.classList.remove('confirm'); b.textContent=t; } },2500);
}

    if(selSet.has(id)){ selSet.delete(id); if(sel===id) sel=[...selSet].pop()||null; }
    else { selSet.add(id); sel=id; }
  } else { selSet=new Set([id]); sel=id; }

}

        ${levels.map(l=>`<tr><td>${l}</td>${n.cost.map(c=>`<td>${fmt(costAt(c,l))}</td>`).join('')}</tr>`).join('')}
        <tr><td class="muted">합계${n.maxLevel>10?' (10Lv)':''}</td>${n.cost.map(c=>`<td style="color:var(--acc2)">${fmt(levels.reduce((a,l)=>a+costAt(c,l),0))}</td>`).join('')}</tr></table>
        ${n.maxLevel>10?`<div class="hint">Lv ${n.maxLevel}: ${n.cost.map(c=>resName(c.resource)+' '+fmt(costAt(c,n.maxLevel))).join(', ')}</div>`:''}`;
    } else cp.innerHTML=''; }
  const dp=$('#descPrev'); if(dp) dp.textContent = describe(n) || '(설명 미리보기)';
  const ni=$('#nodeIssues'); if(ni){ const is=validate().filter(i=>i.id===n.id);
    ni.innerHTML=is.length?is.map(i=>`<div style="color:${lvColor(i.lv)};font-size:12px">● ${esc(i.msg)}</div>`).join(''):'<span style="color:var(--ok);font-size:12px">✓ 문제 없음</span>'; }
}
function readVal(inp){
  const t=inp.dataset.t;
  if(t==='bool') return inp.checked;
  if(t==='num') return inp.value===''?0:num(inp.value);
  if(t==='numOrStr'){ const v=inp.value.trim(); return v!==''&&Number.isFinite(+v)?+v:inp.value; }
  if(t==='tags') return inp.value.split(',').map(s=>s.trim()).filter(Boolean);
  return inp.value;
}
function getPath(o,p){ return p.split('.').reduce((a,k)=>a[/^\d+$/.test(k)?+k:k],o); }
function setPath(o,p,v){ const ks=p.split('.'); const last=ks.pop(); const t=ks.reduce((a,k)=>a[/^\d+$/.test(k)?+k:k],o); t[/^\d+$/.test(last)?+last:last]=v; }
function renameNode(n,inp){ // ID 변경 — 모든 참조 갱신
  const nv=slug(inp.value);
  if(!nv){ toast('ID는 영문·숫자·_ 만 쓸 수 있어요'); inp.value=n.id; return; }
  if(nv!==n.id && node(nv)){ toast('이미 있는 ID예요'); inp.value=n.id; return; }
  const old=n.id; for(const m of P.nodes) [...m.requires.all,...m.requires.any].forEach(c=>{ if(c.node===old) c.node=nv; });
  n.id=nv; sel=nv; selSet=new Set([nv]); changed(true); renderAll();
}

  $('#modal').classList.add('on');
}

${P.meta.concept||'(작성되지 않음)'}

- \`resources[]\`: { id, name, manual(노드 없이 직접 얻는 재화인지), note }

${exportJSON()}

${request||'(여기에 요청을 적어주세요)'}

function curveSVG(ids,st){
  const W=820,H=320,ML=66,MR=16,MT=14,MB=30;
  const series=[];
  for(const id of ids){ const n=node(id); if(!n) continue;
    const c=n.cost.find(c=>c.resource===st.res); if(!c) continue;
    const lv=Math.max(1,Math.min(n.maxLevel,60)); let acc=0; const pts=[];
    for(let l=1;l<=lv;l++){ const v=costAt(c,l); acc+=v; pts.push([l, st.mode==='sum'?acc:v]); }
    series.push({n,pts}); }
  if(!series.length) return `<div class="empty">${esc(resName(st.res))}를 비용으로 쓰는 노드가 없어요</div>`;
  const maxX=Math.max(2,...series.map(s=>s.pts.length));
  const all=series.flatMap(s=>s.pts.map(p=>p[1]));
  const maxY=Math.max(1,...all), minY=st.log?Math.max(1,Math.min(...all)):0;
  const lg=v=>Math.log10(Math.max(v,1));
  const span=st.log?Math.max(lg(maxY)-lg(minY),1e-6):Math.max(maxY-minY,1e-6);
  const X=l=>ML+(l-1)/(maxX-1)*(W-ML-MR);
  const Y=v=>{ const t=st.log?(lg(v)-lg(minY))/span:(v-minY)/span; return MT+(1-Math.min(Math.max(t,0),1))*(H-MT-MB); };
  let g='';
  for(let i=0;i<=5;i++){ const t=i/5;
    const raw=st.log?Math.pow(10,lg(minY)+t*span):minY+t*span, y=Y(raw);
    const v=raw>=100?Math.round(raw):Math.round(raw*10)/10;
    g+=`<line class="gl" x1="${ML}" y1="${y}" x2="${W-MR}" y2="${y}"/><text class="ax" x="${ML-8}" y="${y+3}" text-anchor="end">${esc(fmt(v))}</text>`; }
  const step=Math.max(1,Math.ceil(maxX/12));
  for(let l=1;l<=maxX;l+=step){ const x=X(l);
    g+=`<line class="gl" x1="${x}" y1="${MT}" x2="${x}" y2="${H-MB}"/><text class="ax" x="${x}" y="${H-MB+16}" text-anchor="middle">Lv${l}</text>`; }
  const col=i=>`hsl(${(i*57+28)%360} 72% 63%)`;
  series.forEach((s,i)=>{
    g+=`<path class="ln" stroke="${col(i)}" d="${s.pts.map((p,k)=>`${k?'L':'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ')}"><title>${esc(s.n.name)}</title></path>`;
    const last=s.pts[s.pts.length-1];
    g+=`<circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3.2" fill="${col(i)}"/>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>
    <div class="chips" style="margin-top:8px">${series.map((s,i)=>{ const last=s.pts[s.pts.length-1];
      return `<span class="chip" style="cursor:default;border-color:${col(i)}"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${col(i)};margin-right:6px;vertical-align:-1px"></i>${esc(s.n.name)} <span class="muted">Lv${last[0]} → ${esc(fmt(last[1]))}</span></span>`; }).join('')}</div>`;
}

function extractJSON(text){
  text=text.trim();
  try{ return JSON.parse(text); }catch(e){}
  const blocks=[...text.matchAll(/```(?:json)?\s*([\s\S]*?)```/g)].map(m=>m[1]);
  for(const b of blocks.sort((a,b)=>b.length-a.length)){ try{ return JSON.parse(b); }catch(e){} }
  const s=text.indexOf('{'), e=text.lastIndexOf('}');
  if(s>=0&&e>s){ try{ return JSON.parse(text.slice(s,e+1)); }catch(err){ throw new Error('JSON 형식 오류: '+err.message); } }
  throw new Error('JSON을 찾지 못했어요');
}
function diff(a,b){
  const out=[];
  const cmp=(coll,label,nameOf)=>{
    const la=a[coll], lb=b[coll];
    const A=new Map(la.map(x=>[x.id,x])), B=new Map(lb.map(x=>[x.id,x]));
    lb.forEach((x,i)=>{ if(!A.has(x.id)) out.push(['a',coll,x.id,nameOf(x),label,i]); });
    for(const [id,x] of A) if(!B.has(id)) out.push(['r',coll,id,nameOf(x),label,-1]);
    lb.forEach((x,i)=>{ const y=A.get(x.id); if(!y) return;
      const fields=Object.keys({...x,...y}).filter(k=>JSON.stringify(x[k])!==JSON.stringify(y[k]));
      if(fields.length) out.push(['c',coll,x.id,nameOf(x)+' — '+fields.join(', '),label,i]); });
  };
  cmp('resources','재화',x=>x.name); cmp('nodes','노드',x=>x.name);
  if(a.meta.name!==b.meta.name||a.meta.concept!==b.meta.concept) out.push(['c','meta','meta','이름/컨셉','프로젝트',-1]);
  return out;
}

  try{
    const raw=extractJSON($('#impText').value); const np=normalize(raw);
    if(!np.nodes.length && !np.resources.length) throw new Error('노드나 재화가 없는 데이터예요');
    const d=diff(normalize(P),np); pendingImport=np; pendingDiff=d;
    const sym={a:'+',r:'−',c:'~'};
    box.innerHTML=`<div class="row"><div class="lbl" style="margin:0">변경점 ${d.length}개 <span style="text-transform:none;font-weight:400">(불러올 데이터: 노드 ${np.nodes.length} · 재화 ${np.resources.length})</span></div>
        ${d.length?`<label class="fx0" style="display:flex;gap:6px;align-items:center;color:var(--tx2)"><input type="checkbox" id="dAll" checked style="width:auto">전체 선택</label>`:''}</div>
      <div class="diff">${d.map(([k,coll,id,info,label],i)=>`<label class="${k}"><input type="checkbox" class="dchk" data-i="${i}" checked>
        <span>${sym[k]} [${esc(label)}] ${esc(id)} ${esc(info)}</span></label>`).join('')||'<span class="muted">현재와 동일해요</span>'}</div>
      ${d.length?'<div class="hint">체크한 항목만 적용돼요. 전부 체크하면 통째로 교체됩니다.</div>':''}`;
    const all=$('#dAll'); if(all) all.onchange=e=>document.querySelectorAll('.dchk').forEach(c=>c.checked=e.target.checked);
    return true;
  }catch(e){ box.innerHTML=`<div style="color:var(--err)">${esc(e.message)}</div>`; return false; }
}
function mergePick(cur,imp,picks){
  const out=JSON.parse(JSON.stringify(cur)), cp=x=>JSON.parse(JSON.stringify(x));
  for(const [k,coll,id,,,idx] of picks){
    if(coll==='meta'){ out.meta={...imp.meta}; continue; }
    const list=out[coll], src=imp[coll].find(x=>x.id===id), at=list.findIndex(x=>x.id===id);
    if(k==='r'){ if(at>=0) list.splice(at,1); }
    else if(!src) continue;
    else if(at>=0) list[at]=cp(src);
    else list.splice(Math.min(idx<0?list.length:idx,list.length),0,cp(src));
  }
  return out;
}
function applyImport(){
  if(!pendingImport && !checkImport()) return;
  if(!pendingImport) return;
  const boxes=[...document.querySelectorAll('.dchk')];
  const picks=boxes.filter(c=>c.checked).map(c=>pendingDiff[+c.dataset.i]).filter(Boolean);
  if(boxes.length && !picks.length){ toast('적용할 항목을 하나 이상 선택하세요'); return; }
  const full = !boxes.length || picks.length===boxes.length;
  snapshot();
  P = normalize(full ? pendingImport : mergePick(normalize(P),pendingImport,picks));
  const n=picks.length; pendingImport=null; pendingDiff=[];
  pruneSel(); fitted=false;
  changed(true); renderAll(); closeModal();
  if(pendingHandle){ linkHandle(pendingHandle,!full); pendingHandle=null; }
  toast(full?'전체를 불러왔어요 — 되돌리려면 Ctrl+Z':`${n}개 변경을 적용했어요 — 되돌리려면 Ctrl+Z`);
}

/* ================= 전체 렌더 ================= */
let rTimer=null;
function scheduleRender(){ clearTimeout(rTimer); rTimer=setTimeout(()=>{ const is=validate(); renderGraph(is); renderTop(is); if(tab==='nodes') renderLeft(is); },120); }
function renderAll(){ const is=validate(); renderGraph(is); renderTop(is); renderLeft(is); renderRight(); renderFile(); }
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; renderLeft(validate()); });
$('#undoBtn').onclick=undo; $('#redoBtn').onclick=redo;
window.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); e.shiftKey?saveFileAs():saveFile(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing){ e.preventDefault(); e.shiftKey?redo():undo(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'&&!typing){ e.preventDefault(); redo(); }
  if(e.key==='Escape'){
    if($('#picker').classList.contains('on')) closePicker();
    else if($('#modal').classList.contains('on')) closeModal();
    else if(!typing) select(null); }
  if(!typing && (e.key==='n'||e.key==='N') && !e.ctrlKey && !e.metaKey){ e.preventDefault(); addNode(); }
  if(!typing && e.key==='f' && !e.ctrlKey && !e.metaKey) fit();
  if(!typing && (e.key==='a'||e.key==='A') && (e.ctrlKey||e.metaKey)){ e.preventDefault();
    selSet=new Set(P.nodes.filter(matchFilter).map(n=>n.id)); sel=[...selSet].pop()||null; renderAll(); }
});
window.addEventListener('beforeunload',e=>{ if(dirty&&fileHandle&&!autoSave){ e.preventDefault(); e.returnValue=''; } });
window.addEventListener('resize',()=>applyView());

function boot(){
  wirePicker();
  migrateOld();
  const l=listProjects().slice().sort((a,b)=>(b.updated||0)-(a.updated||0));
  const last=localStorage.getItem(LAST_KEY);
  const pick=l.find(x=>x.id===last)||l[0];
  if(pick) loadProject(pick.id);
  else { P=normalize(blankProject()); curId=null; renderAll(); snapshot(); }
  openPicker();
}
boot();
</script>
